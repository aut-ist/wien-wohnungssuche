<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gigibirds Nestlesuche</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f9d61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nestlesuche">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f2; --panel: #fff; --ink: #1d1f23; --muted: #6b7079; --line: #e6e4de; --soft: #f1f0ec;
    --gruen: #1f9d61; --grau: #8b9099; --raus: #d24b3e; --gold: #e3a400; --zone: #3b5bdb;
    --shadow: 0 8px 28px rgba(20, 22, 26, .14); --r: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  /* Leiste wächst mit dem Bildschirm; ab ~1700 px passen zwei Spalten Wohnungen nebeneinander */
  #app { display: grid; grid-template-columns: clamp(480px, 40vw, 860px) 1fr; grid-template-rows: auto 1fr; height: 100dvh; }

  /* Kopfzeile */
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); z-index: 3; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .stand { color: var(--muted); font-size: 12.5px; }
  .marke { display: flex; align-items: center; gap: 10px; }
  .gigibird { width: 52px; height: 44px; flex: none; overflow: visible; }
  .gigibird .vogel { transform-origin: 25px 40px; animation: bruten 4s ease-in-out infinite; }
  .gigibird .auge { transform-origin: 18.5px 23px; animation: zwinkern 5s infinite; }
  .gigibird:hover .vogel { animation: hops .5s ease-in-out 2; }
  .motto { font-style: italic; color: #b07a1c; }
  @keyframes bruten { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-2.5deg) translateY(-.6px); } }
  @keyframes zwinkern { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes hops { 50% { transform: translateY(-5px); } }
  @media (prefers-reduced-motion: reduce) { .gigibird .vogel, .gigibird .auge { animation: none; } }
  #sync { margin-left: 6px; }
  #sync::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; background: #c9a227; vertical-align: 1px; }
  #sync[data-ok="1"]::before { background: var(--gruen); }
  .kopf-rechts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
  .btn:hover { background: var(--soft); }
  .btn[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn .zahl { background: var(--soft); color: var(--ink); border-radius: 999px; padding: 0 7px; font-size: 12px; font-weight: 600; }
  .btn[aria-pressed="true"] .zahl { background: rgba(255,255,255,.2); color: #fff; }

  /* Filter */
  #filter { grid-column: 1 / -1; display: none; gap: 14px 22px; flex-wrap: wrap; align-items: flex-end;
    padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 3; }
  #filter.offen { display: flex; }
  #app.filter-offen { grid-template-rows: auto auto 1fr; }
  .feld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .feld input[type=number] { width: 110px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 12.5px; color: var(--ink); }
  .chip[aria-pressed="true"] { background: #e8edff; border-color: #b7c4ff; color: #22337a; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }

  /* Seitenleiste */
  #seite { position: relative; overflow: hidden; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
  .tab { flex: 1; padding: 10px 6px; border: 0; background: none; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  #liste { overflow-y: auto; flex: 1; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr));
    grid-auto-rows: max-content; align-content: start; gap: 10px; }
  #liste .leer { grid-column: 1 / -1; }
  .gmaps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .gmaps a { font-size: 12px; font-weight: 600; text-decoration: none; color: #1a56c4; background: #eef3fd;
    border: 1px solid #d6e2fb; border-radius: 999px; padding: 3px 10px; }
  .gmaps a:hover { background: #e0eafc; }
  .gmaps.gross a { font-size: 13px; padding: 7px 14px; }
  .leer { padding: 30px 12px; color: var(--muted); text-align: center; }

  .karte { flex: none; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: #fff; transition: box-shadow .15s, border-color .15s; }
  .karte:hover, .karte.aktiv { box-shadow: var(--shadow); border-color: #d5d2ca; }
  .karte.gemerkt { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
  .fotos { position: relative; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: 280px; background: var(--soft); scrollbar-width: none; }
  .fotos::-webkit-scrollbar { display: none; }
  .fotos img { flex: 0 0 100%; width: 100%; height: 280px; object-fit: cover; scroll-snap-align: start; cursor: zoom-in; }
  .foto-wrap { position: relative; }
  .foto-zahl { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 11.5px; padding: 2px 7px; border-radius: 999px; pointer-events: none; }
  .foto-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.9); cursor: pointer; font-size: 16px; display: none; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .foto-wrap:hover .foto-nav { display: block; }
  .foto-nav.l { left: 8px; } .foto-nav.r { right: 8px; }
  .aktionen { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
  .rund { width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
    font-size: 17px; background: rgba(255,255,255,.95); box-shadow: 0 2px 8px rgba(0,0,0,.2); line-height: 1; }
  .rund.stern { color: #9a9a9a; } .rund.stern.an { color: var(--gold); }
  .rund.x { color: var(--raus); font-weight: 700; }
  .rund.zurueck { color: var(--gruen); }
  .karte-body { padding: 10px 12px 12px; cursor: pointer; }
  .zeile1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .preis { font-weight: 700; font-size: 17px; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .titel { font-size: 13px; margin: 3px 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fakten { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: #4d525a; }
  .tag.neu { background: #fff1c2; color: #7a5a00; }
  .tag.gruen { background: #e2f4ea; color: #146b42; }
  .tag.grau { background: #eceef1; color: #4d525a; }
  .tag.raus { background: #fbe5e2; color: #9c2f24; }
  .tag.gold { background: #fff3cc; color: #7a5a00; }
  .tag.gesehen { background: #e8edff; color: #22337a; }
  .karte.gesehen .preis, .karte.gesehen .titel { color: #555a62; }

  /* Detail */
  #detail { position: absolute; inset: 0; background: var(--panel); z-index: 5; overflow-y: auto; transform: translateX(-102%); transition: transform .22s ease; }
  #detail.offen { transform: translateX(0); }
  .detail-kopf { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); }
  .detail-kopf .spacer { flex: 1; }
  .galerie { position: relative; background: #111; }
  .galerie .gross { width: 100%; height: 400px; object-fit: contain; display: block; background: #111; cursor: zoom-in; }
  .galerie .voll-hinweis { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.55); color: #fff;
    font-size: 11.5px; padding: 3px 8px; border-radius: 999px; pointer-events: none; }

  /* Vollbild-Fotos */
  #vollbild { position: fixed; inset: 0; z-index: 5000; background: rgba(10,10,12,.96); display: none;
    flex-direction: column; align-items: center; justify-content: center; touch-action: pan-y; }
  #vollbild.offen { display: flex; }
  #vollbild img { max-width: 100vw; max-height: calc(100dvh - 120px); object-fit: contain; user-select: none; }
  #vollbild .vb-kopf { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; color: #fff; font-size: 13px; }
  #vollbild .vb-kopf .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
  #vollbild button { border: 0; cursor: pointer; color: #fff; background: rgba(255,255,255,.14); border-radius: 50%;
    width: 44px; height: 44px; font-size: 22px; display: grid; place-items: center; }
  #vollbild button:hover { background: rgba(255,255,255,.28); }
  #vollbild .vb-l, #vollbild .vb-r { position: absolute; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; font-size: 28px; }
  #vollbild .vb-l { left: 14px; } #vollbild .vb-r { right: 14px; }
  #vollbild .vb-thumbs { position: absolute; bottom: 0; left: 0; right: 0; display: flex; gap: 6px; overflow-x: auto;
    padding: 10px 16px; justify-content: safe center; scrollbar-width: thin; }
  #vollbild .vb-thumbs img { width: 70px; height: 52px; object-fit: cover; border-radius: 5px; opacity: .5; cursor: pointer; flex: none; max-height: none; }
  #vollbild .vb-thumbs img.an { opacity: 1; outline: 2px solid #fff; }

  /* aktuell geöffnete Wohnung auf der Karte */
  .ei-icon.aktiv { z-index: 9000 !important; }
  .ei-icon.aktiv svg { animation: ei-hops 1.6s ease-in-out infinite; }
  .ei-icon.aktiv::before { content: ''; position: absolute; left: 50%; top: 55%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
    border-radius: 50%; border: 3px solid #e3a400; background: rgba(227,164,0,.18); animation: ei-puls 1.6s ease-out infinite; }
  @keyframes ei-puls { 0% { transform: scale(.55); opacity: 1; } 100% { transform: scale(1.35); opacity: 0; } }
  @keyframes ei-hops { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .galerie .foto-nav { display: block; }
  .thumbs { display: flex; gap: 4px; overflow-x: auto; padding: 6px; background: #111; scrollbar-width: thin; }
  .thumbs img { width: 64px; height: 48px; object-fit: cover; border-radius: 4px; opacity: .55; cursor: pointer; flex: none; }
  .thumbs img.an { opacity: 1; outline: 2px solid #fff; }
  .detail-body { padding: 14px 16px 30px; }
  .detail-body h2 { font-size: 16px; margin: 6px 0 10px; line-height: 1.35; }
  .detail-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fakt { background: var(--soft); border-radius: 10px; padding: 8px 10px; }
  .fakt b { display: block; font-size: 14.5px; }
  .fakt span { font-size: 11.5px; color: var(--muted); }
  .info { border-left: 3px solid var(--line); padding: 4px 10px; margin: 6px 0; font-size: 13px; }
  .info.gruen { border-color: var(--gruen); } .info.grau { border-color: var(--grau); } .info.raus { border-color: var(--raus); }
  .text { white-space: pre-wrap; font-size: 13.5px; line-height: 1.55; }
  .text h4 { margin: 14px 0 4px; font-size: 13.5px; }
  .quellen { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .quellen span { font-size: 11px; color: #4d525a; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
  .links { display: flex; flex-direction: column; gap: 6px; }
  .link { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    text-decoration: none; color: var(--ink); background: #fff; }
  .link:hover { background: var(--soft); }
  .link .q { font-weight: 600; flex: 1; }
  .link .pfeil { color: var(--muted); }
  .gross-btn { display: block; text-align: center; background: var(--ink); color: #fff; text-decoration: none; border-radius: 10px; padding: 11px; font-weight: 600; margin-top: 16px; }

  /* Karte */
  #map { height: 100%; min-height: 0; }
  .leaflet-tooltip.vorschau { padding: 0; border: 0; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
  .vorschau img { width: 200px; height: 120px; object-fit: cover; display: block; }
  .vorschau div { padding: 6px 9px; font: 12.5px/1.35 Inter, system-ui, sans-serif; }
  .leaflet-tooltip.station { background: rgba(255,255,255,.88); border: 0; box-shadow: none; padding: 1px 5px; font: 11px/1.3 Inter, system-ui, sans-serif; color: #1d1f23; }
  .leaflet-tooltip.station::before { display: none; }
  .ei-icon { background: none; border: 0; }
  .ei-icon svg { display: block; overflow: visible; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.35)); }
  .ei-icon:hover svg { transform: translateY(-2px) scale(1.08); transition: transform .15s; }
  .leg-ei { display: inline-block; vertical-align: -3px; margin: 0 2px 0 6px; }
  .leg-ei svg { overflow: visible; }
  .nur-handy { display: none; }
  @media (max-width: 800px) { .nur-handy { display: inline-flex; } }
  .karte-groesse { display: none; box-shadow: var(--shadow); }
  @media (max-width: 800px) { .karte-groesse { display: inline-flex; } }
  .legende { background: var(--panel); padding: 8px 10px; border-radius: 10px; box-shadow: var(--shadow); font-size: 12px; line-height: 1.75; }
  .legende i { display: inline-block; width: 16px; height: 0; margin-right: 6px; vertical-align: middle; border-top: 3px solid; }
  .legende .flaeche { height: 10px; border: 1.5px solid; border-radius: 2px; }

  @media (max-width: 800px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 42dvh 1fr; }
    #app.filter-offen { grid-template-rows: auto auto 42dvh 1fr; }
    #map { grid-row: -3; }
    #app.karte-gross { grid-template-rows: auto 78dvh 1fr; }
    #app.karte-gross.filter-offen { grid-template-rows: auto auto 78dvh 1fr; }
    #seite { grid-row: -2; border-right: 0; border-top: 1px solid var(--line); }
    #detail { position: fixed; z-index: 2000; transform: translateY(102%); }
    #detail.offen { transform: translateY(0); }
    .galerie .gross { height: 320px; }
    .fotos, .fotos img { height: 240px; }
    #vollbild .vb-l, #vollbild .vb-r { display: none; }
    .kopf-rechts { margin-left: 0; }
    #stand, .trenner { display: none; }
    header > div:first-child, .marke, .marke > div { min-width: 0; }
    h1 { font-size: 15.5px; }
    .gigibird { width: 42px; height: 36px; }
    .motto { display: block; font-size: 11.5px; }
    header > div:first-child { flex: 1 1 100%; }
    .legende:not(.offen) > div { display: none; }
    .legende:not(.offen)::before { content: 'Legende'; font-weight: 600; cursor: pointer; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="marke">
        <svg class="gigibird" viewBox="0 0 64 54" aria-hidden="true">
          <!-- Nest -->
          <path d="M6 36 Q32 58 58 36 Q57 46 46 50 Q32 55 18 50 Q7 46 6 36Z" fill="#9a6b3f"/>
          <path d="M8 38 Q20 46 34 45 M14 44 Q30 50 50 42 M22 49 Q36 51 54 39" stroke="#6e4826" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <!-- Eier -->
          <ellipse cx="44" cy="35" rx="5.2" ry="6.6" fill="#fff6e6" stroke="#e5d3b3" stroke-width="1"/>
          <ellipse cx="53" cy="36.5" rx="4.4" ry="5.6" fill="#f3fbff" stroke="#cfe3ee" stroke-width="1"/>
          <circle cx="45.5" cy="33" r="0.9" fill="#d9c09a"/><circle cx="52" cy="35" r="0.8" fill="#a9c9da"/>
          <!-- Gigibird, brütet und hält schützend den Flügel über die Eier -->
          <g class="vogel">
            <ellipse cx="25" cy="27" rx="15" ry="13" fill="#f6b73c"/>
            <ellipse cx="22" cy="31" rx="9" ry="7.5" fill="#ffe2a3"/>
            <path d="M28 25 Q44 22 50 31 Q41 30 33 33 Q28 31 28 25Z" fill="#e0952a"/>
            <path d="M20 14 Q22 8 26 12 Q27 7 30 13" stroke="#e0952a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            <circle class="auge" cx="18.5" cy="23" r="2.3" fill="#1d1f23"/>
            <circle cx="19.3" cy="22.2" r="0.7" fill="#fff"/>
            <path d="M10.5 26 L5 28.2 L10.8 29.8Z" fill="#f07d2e"/>
            <circle cx="14.5" cy="28.5" r="2" fill="#f7a08a" opacity=".7"/>
          </g>
        </svg>
        <div>
          <h1>Gigibirds Nestlesuche</h1>
          <div class="stand"><span class="motto">Nestle schaua, Nestle suacha</span><span class="trenner"> · </span><span id="stand">Gigibird suacht Nestle …</span> <span id="sync" hidden></span></div>
        </div>
      </div>
    </div>
    <div class="kopf-rechts">
      <button class="btn" id="btnFilter" aria-pressed="false">Filter <span class="zahl" id="nTreffer">0</span></button>
      <button class="btn" id="btnOeffis" aria-pressed="true">Öffis 18./19.</button>
    </div>
  </header>
  <section id="filter" aria-label="Filter">
    <label class="feld">Preis bis (€)<input type="number" id="fPreis" step="10000" min="0" placeholder="1.000.000"></label>
    <label class="feld">m² ab<input type="number" id="fFlaeche" step="5" min="0" placeholder="70"></label>
    <label class="feld">Zimmer ab<input type="number" id="fZimmer" step="1" min="0" placeholder="4"></label>
    <div class="feld">Bezirk<div class="chips" id="fBezirke"></div></div>
    <div class="feld">Status<div class="chips" id="fStatus"></div></div>
    <div class="feld">Sonstiges<div class="chips" id="fExtra"></div></div>
    <div class="feld">Sortierung
      <select id="fSort" class="chip">
        <option value="neu">Neueste zuerst</option>
        <option value="preis">Preis aufsteigend</option>
        <option value="qm">€/m² aufsteigend</option>
        <option value="flaeche">Größte zuerst</option>
      </select>
    </div>
    <button class="btn" id="fReset">Zurücksetzen</button>
  </section>
  <aside id="seite">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="alle" aria-selected="true">Alle Nestle <span id="nAlle"></span></button>
      <button class="tab" role="tab" data-tab="gemerkt" aria-selected="false">🥚 Im Nest <span id="nGemerkt"></span></button>
      <button class="tab" role="tab" data-tab="papierkorb" aria-selected="false">Aus'm Nest gheit <span id="nPapierkorb"></span></button>
    </div>
    <div id="liste"></div>
    <div id="detail" aria-live="polite"></div>
  </aside>
  <div id="map"></div>
  <div id="vollbild" role="dialog" aria-label="Fotos im Vollbild">
    <div class="vb-kopf"><span class="vb-zahl"></span><span class="t"></span><button class="vb-zu" aria-label="Schließen">✕</button></div>
    <button class="vb-l" aria-label="Foto zurück">‹</button>
    <img alt="">
    <button class="vb-r" aria-label="Foto weiter">›</button>
    <div class="vb-thumbs"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script>
const FARBE = { gruen: '#1f9d61', grau: '#8b9099', raus: '#d24b3e' };
const EI = 'M10 1C4.6 1 1 9.6 1 15.6 1 21.6 4.9 25 10 25s9-3.4 9-9.4C19 9.6 15.4 1 10 1Z';  // Eiform für Marker
const STATUS_TXT = { gruen: 'passt', grau: 'unklar', raus: 'ausgeschlossen' };
const HEIZ_TXT = { gas: 'Gasheizung', kein_gas: 'kein Gas', unklar: 'Heizung unklar' };
const BEZIRKE = { 1010: '1.', 1020: '2.', 1080: '8.', 1090: '9.', 1180: '18.', 1190: '19.' };
const OEFFI = { tram: { c: '#c2185b', w: 3, n: 'Straßenbahn' }, bus: { c: '#e8710a', w: 2, d: '5 4', n: 'Bus' },
  ubahn: { c: '#6d4c41', w: 4, n: 'U-Bahn' }, sbahn: { c: '#0277bd', w: 3, d: '8 4', n: 'S-Bahn' } };
const eur = n => n == null ? '–' : '€ ' + Math.round(n).toLocaleString('de-AT');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const img = (src, extra = '') => `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" ${extra}>`;

/* ---------- Speicher ----------
   Merken, Papierkorb und "angesehen" sind gemeinsam für alle Besucher (Firebase Realtime
   Database, live). localStorage dient nur als Zwischenspeicher fürs schnelle Laden und als
   Notlösung, solange keine Datenbank eingetragen ist. Filter bleiben pro Gerät. */
const LISTEN = ['gemerkt', 'papierkorb', 'gesehen'];
const speicher = {
  key: 'wohnungssuche.v1',
  lesen() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch { return {}; } },
  schreiben(d) { try { localStorage.setItem(this.key, JSON.stringify(d)); } catch {} },
};
const mein = Object.assign({ gemerkt: {}, papierkorb: {}, gesehen: {}, filter: null }, speicher.lesen());
const sichern = () => speicher.schreiben(mein);

const gemeinsam = {
  basis: null, verbunden: false, hochgeladen: false,
  async start(onAenderung) {
    try {
      const e = await fetch('einstellungen.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {});
      if (e.firebase) this.basis = e.firebase.replace(/\/+$/, '') + '/markierungen';
    } catch {}
    this.status();
    if (!this.basis) return;
    let timer;
    const neuZeichnen = () => { clearTimeout(timer); timer = setTimeout(onAenderung, 120); };
    const es = new EventSource(this.basis + '.json');
    es.onopen = () => { this.verbunden = true; this.status(); };
    es.onerror = () => { this.verbunden = false; this.status(); };
    const anwenden = (msg, patch) => {
      const teile = msg.path.split('/').filter(Boolean);
      if (!teile.length) {
        const d = msg.data || {};
        if (!patch) {
          if (!this.hochgeladen) this.altbestand(d);
          for (const l of LISTEN) mein[l] = Object.assign({}, d[l] || {});
        } else for (const [l, v] of Object.entries(d)) if (LISTEN.includes(l)) mein[l] = Object.assign({}, v || {});
      } else if (teile.length === 1 && LISTEN.includes(teile[0])) {
        mein[teile[0]] = patch ? Object.assign(mein[teile[0]], msg.data) : Object.assign({}, msg.data || {});
      } else if (teile.length === 2 && LISTEN.includes(teile[0])) {
        if (msg.data == null) delete mein[teile[0]][teile[1]]; else mein[teile[0]][teile[1]] = msg.data;
      }
      sichern(); neuZeichnen();
    };
    es.addEventListener('put', e => anwenden(JSON.parse(e.data), false));
    es.addEventListener('patch', e => anwenden(JSON.parse(e.data), true));
  },
  // Markierungen, die vor der Umstellung nur auf diesem Gerät lagen, einmalig hochladen
  altbestand(server) {
    this.hochgeladen = true;
    for (const l of LISTEN) for (const [id, t] of Object.entries(mein[l] || {}))
      if (!(server[l] || {})[id]) { this.schreiben(l, id, t); (server[l] = server[l] || {})[id] = t; }
  },
  schreiben(liste, id, wert) {
    if (!this.basis) return;
    fetch(`${this.basis}/${liste}/${encodeURIComponent(id)}.json`,
      { method: wert == null ? 'DELETE' : 'PUT', body: wert == null ? undefined : JSON.stringify(wert) })
      .catch(() => { this.verbunden = false; this.status(); });
  },
  status() {
    const el = document.getElementById('sync');
    if (!el) return;
    el.hidden = false;
    el.textContent = !this.basis ? 'nur auf diesem Gerät' : this.verbunden ? 'gemeinsam · live' : 'verbinde …';
    el.dataset.ok = this.basis && this.verbunden ? '1' : '0';
  },
};
// eine Markierung setzen (wert) oder entfernen (null) – lokal sofort, gemeinsam im Hintergrund
function markiere(liste, id, wert) {
  if (wert == null) delete mein[liste][id]; else mein[liste][id] = wert;
  sichern();
  gemeinsam.schreiben(liste, id, wert);
}

const STD_FILTER = { preis: null, flaeche: null, zimmer: null, bezirke: Object.keys(BEZIRKE).map(Number),
  status: ['gruen', 'grau'], neu: false, freiflaeche: false, ungesehen: false, sort: 'neu' };
let filter = Object.assign({}, STD_FILTER, mein.filter || {});
const state = { daten: [], tab: 'alle', marker: {}, aktiv: null, bildIdx: 0, details: {} };

/* ---------- Karte ---------- */
const map = L.map('map', { zoomControl: false }).setView([48.232, 16.345], 13);
L.control.zoom({ position: 'topright' }).addTo(map);
// Vektorkarte (OpenFreeMap) mit Farben im Stil von Google Maps
const basis = L.maplibreGL({
  style: 'https://tiles.openfreemap.org/styles/liberty',
  attribution: '<a href="https://openfreemap.org">OpenFreeMap</a> © OpenMapTiles © OpenStreetMap · Daten: Stadt Wien, willhaben'
}).addTo(map);
basis.getMaplibreMap().on('load', () => googleFarben(basis.getMaplibreMap()));
function googleFarben(m) {
  const setze = (id, prop, wert) => { try { m.setPaintProperty(id, prop, wert); } catch {} };
  for (const l of m.getStyle().layers) {
    const id = l.id, t = l.type;
    if (t === 'background') setze(id, 'background-color', '#f1f3f4');
    else if (t === 'fill-extrusion') {  // 3D-Gebäude flach und hellgrau wie bei Google
      setze(id, 'fill-extrusion-color', '#e3e3e3'); setze(id, 'fill-extrusion-height', 0);
      setze(id, 'fill-extrusion-base', 0); setze(id, 'fill-extrusion-opacity', 1);
    }
    else if (/water/.test(id) && t === 'fill') setze(id, 'fill-color', '#a6d5f2');
    else if (/waterway/.test(id) && t === 'line') setze(id, 'line-color', '#a6d5f2');
    else if (/park|grass|wood|forest|garden|cemetery|pitch|landcover/.test(id) && t === 'fill') {
      setze(id, 'fill-color', /cemetery/.test(id) ? '#d4ead0' : '#c9eac4'); setze(id, 'fill-opacity', 1);
    }
    else if (/landuse/.test(id) && t === 'fill') setze(id, 'fill-color', /residential/.test(id) ? '#f1f3f4' : '#ececec');
    else if (/building/.test(id) && t === 'fill') { setze(id, 'fill-color', '#e6e6e6'); setze(id, 'fill-outline-color', '#d9d9d9'); }
    else if (/road|highway|bridge|tunnel/.test(id) && t === 'line' && !/rail|path|track|pier/.test(id)) {
      if (/casing/.test(id)) setze(id, 'line-color', '#dadce0');
      else setze(id, 'line-color', /motorway|trunk/.test(id) ? '#fde293' : '#ffffff');
    }
  }
}
map.createPane('gebiete').style.zIndex = 350;
map.createPane('oeffis').style.zIndex = 380;
const oeffiEbene = L.layerGroup().addTo(map);
const markerEbene = L.layerGroup().addTo(map);

// kleines Ei für die Legende (eiSvg ist weiter unten definiert, wird aber erst beim Aufruf gebraucht)
const legEi = (status, o = {}) => `<span class="leg-ei">${eiSvg({ status, neu: o.neu, ungefaehr: o.ungefaehr, ids: ['_leg'],
  _gesehen: !!o.gesehen }, 16)}</span>`;
const legende = L.control({ position: 'bottomright' });
legende.onAdd = () => {
  const d = L.DomUtil.create('div', 'legende');
  d.innerHTML =
    '<div><i class="flaeche" style="border-color:#3b5bdb;background:rgba(59,91,219,.12)"></i>Suchgebiet</div>' +
    '<div><i class="flaeche" style="border-color:#d24b3e;background:rgba(210,75,62,.15)"></i>nicht erwünscht</div>' +
    Object.values(OEFFI).map(o => `<div class="oeffi-leg"><i style="border-color:${o.c};${o.d ? 'border-top-style:dashed' : ''}"></i>${o.n}</div>`).join('') +
    `<div>${legEi('gruen')} passt ${legEi('grau')} unklar ${legEi('raus')} raus</div>` +
    `<div>${legEi('gruen', { gesehen: true })} scho gschaut ${legEi('gruen', { neu: true })} neu</div>` +
    `<div>${legEi('gruen', { ungefaehr: true })} Lage ungefähr · 🪺 im Nest</div>`;
  d.addEventListener('click', () => d.classList.toggle('offen'));
  L.DomEvent.disableClickPropagation(d);
  return d;
};
legende.addTo(map);

async function ladeGebiete() {
  const j = p => fetch(p).then(r => r.json());
  const [bez, zonen, oeffis] = await Promise.all([j('geo/bezirke.geojson'), j('geo/zones.geojson'), j('geo/oeffis.geojson').catch(() => null)]);
  L.geoJSON(bez, { pane: 'gebiete', interactive: false,
    style: f => [8, 9, 18, 19].includes(f.properties.bezirk)
      ? { color: '#3b5bdb', weight: 1.5, fillOpacity: .06 }
      : { color: '#3b5bdb', weight: 1, dashArray: '4 4', fillOpacity: 0 } }).addTo(map);
  L.geoJSON(zonen, { pane: 'gebiete',
    style: f => f.properties.rolle === 'erlaubt'
      ? { color: '#3b5bdb', weight: 2, fillOpacity: .12 }
      : { color: '#d24b3e', weight: 2, fillOpacity: .15 },
    onEachFeature: (f, l) => l.bindTooltip(f.properties.name, { sticky: true }) }).addTo(map);
  if (oeffis) {
    L.geoJSON(oeffis, { pane: 'oeffis', filter: f => f.properties.typ !== 'station',
      style: f => { const o = OEFFI[f.properties.typ]; return { color: o.c, weight: o.w, dashArray: o.d, opacity: .8 }; },
      onEachFeature: (f, l) => l.bindTooltip(`${OEFFI[f.properties.typ].n} ${esc(f.properties.linien)}`, { sticky: true }) }).addTo(oeffiEbene);
    L.geoJSON(oeffis, { pane: 'oeffis', filter: f => f.properties.typ === 'station',
      pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 5, color: '#1d1f23', weight: 2, fillColor: '#fff', fillOpacity: 1 })
        .bindTooltip(`${esc(f.properties.name)} <b>${esc(f.properties.linien)}</b>`, { permanent: true, direction: 'right', offset: [6, 0], className: 'station' })
    }).addTo(oeffiEbene);
  }
}

/* ---------- Filtern ---------- */
function passtFilter(w) {
  if (filter.preis && w.preis > filter.preis) return false;
  if (filter.flaeche && w.flaeche && w.flaeche < filter.flaeche) return false;
  if (filter.zimmer && w.zimmer && w.zimmer < filter.zimmer) return false;
  if (!filter.bezirke.includes(w.plz)) return false;
  if (!filter.status.includes(w.status)) return false;
  if (filter.neu && !w.neu) return false;
  if (filter.freiflaeche && !(w.freiflaeche || []).length) return false;
  if (filter.ungesehen && istGesehen(w)) return false;
  return true;
}
// Ein Punkt kann mehrere Inserate (Portale) bündeln: markiert ist er, wenn irgendeines markiert ist
const idsVon = w => w.ids || [w.id];
const hat = (liste, w) => idsVon(w).some(id => mein[liste][id]);
const istGesehen = w => hat('gesehen', w);
function sortiere(l) {
  const s = {
    neu: (a, b) => b.erstmals.localeCompare(a.erstmals) || (b.preis ?? 0) - (a.preis ?? 0),
    preis: (a, b) => (a.preis ?? 1e12) - (b.preis ?? 1e12),
    qm: (a, b) => (a.preis / a.flaeche || 1e9) - (b.preis / b.flaeche || 1e9),
    flaeche: (a, b) => (b.flaeche ?? 0) - (a.flaeche ?? 0),
  }[filter.sort];
  return l.sort(s);
}
const imPapierkorb = w => hat('papierkorb', w);
const istGemerkt = w => hat('gemerkt', w);
function sichtbar() {
  const basis = state.daten.filter(w => !imPapierkorb(w) && passtFilter(w));
  return {
    karte: basis,
    alle: basis,
    gemerkt: state.daten.filter(w => istGemerkt(w) && !imPapierkorb(w)),
    papierkorb: state.daten.filter(imPapierkorb),
  };
}

/* ---------- Darstellung ---------- */
function fakten(w) {
  const qm = w.preis && w.flaeche ? eur(w.preis / w.flaeche) + '/m²' : '';
  return { qm, txt: [`${w.flaeche ?? '?'} m²`, `${w.zimmer ?? '?'} Zimmer`, ...(w.freiflaeche || [])] };
}
// Schnell-Links zu Google Maps / Street View. Bei ungefährer Lage sind die Koordinaten nur
// gestreut (Bezirksmitte), daher dann nur eine Suche nach Straße bzw. Bezirk, kein Street View.
function mapsLinks(w, gross) {
  const genau = !w.ungefaehr && w.lat;
  const ziel = w.adresse && /[a-zäöüß]{4}/i.test(w.adresse) ? `${w.adresse}, ${w.plz} Wien`
    : genau ? `${w.lat},${w.lon}` : `${w.plz} Wien`;
  const suche = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ziel)}`;
  const sv = genau ? `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${w.lat},${w.lon}` : null;
  return `<div class="gmaps${gross ? ' gross' : ''}">
    <a href="${esc(suche)}" target="_blank" rel="noopener" data-akt="link">📍 Google Maps${genau || w.adresse ? '' : ' (nur Bezirk)'}</a>
    ${sv ? `<a href="${esc(sv)}" target="_blank" rel="noopener" data-akt="link">👁 Street View</a>` : ''}</div>`;
}
function tagsHtml(w) {
  const h = w.heizung || {};
  return `<div class="tags">
    ${w.neu ? '<span class="tag neu">NEU</span>' : ''}
    ${istGesehen(w) ? '<span class="tag gesehen">✓ scho gschaut</span>' : ''}
    <span class="tag ${w.status}">${STATUS_TXT[w.status]}</span>
    ${h.ergebnis ? `<span class="tag ${h.ergebnis === 'kein_gas' ? 'gruen' : h.ergebnis === 'gas' ? 'raus' : 'grau'}">${HEIZ_TXT[h.ergebnis]}</span>` : ''}
    ${w.ungefaehr ? '<span class="tag">Lage ungefähr</span>' : ''}
    ${w.preis_historie?.length ? '<span class="tag gold">Preis geändert</span>' : ''}
  </div>`;
}
function aktionenHtml(w, papierkorb) {
  return papierkorb
    ? `<button class="rund zurueck" data-akt="zurueck" data-id="${esc(w.id)}" title="Zurückholen" aria-label="Zurückholen">↺</button>`
    : `<button class="rund stern ${istGemerkt(w) ? 'an' : ''}" data-akt="merken" data-id="${esc(w.id)}" title="${istGemerkt(w) ? 'Aus dem Nest nehmen' : 'Ins Nest legen'}" aria-label="Ins Nest legen">🥚</button>
       <button class="rund x" data-akt="weg" data-id="${esc(w.id)}" title="Aus'm Nest werfen" aria-label="Aus'm Nest werfen">✕</button>`;
}
function karteHtml(w, papierkorb) {
  const f = fakten(w);
  const bilder = (w.bilder || []).slice(0, 12);
  return `<article class="karte ${istGemerkt(w) ? 'gemerkt' : ''} ${istGesehen(w) ? 'gesehen' : ''} ${state.aktiv === w.id ? 'aktiv' : ''}" data-id="${esc(w.id)}">
    <div class="foto-wrap">
      <div class="fotos" data-id="${esc(w.id)}">${bilder.length ? bilder.map(b => img(b, 'data-akt="vollbild"')).join('') : '<div style="flex:1"></div>'}</div>
      ${bilder.length > 1 ? `<button class="foto-nav l" data-akt="links" aria-label="Foto zurück">‹</button><button class="foto-nav r" data-akt="rechts" aria-label="Foto weiter">›</button>
      <span class="foto-zahl">${(w.bilder || []).length} Fotos</span>` : ''}
      <div class="aktionen">${aktionenHtml(w, papierkorb)}</div>
    </div>
    <div class="karte-body" data-akt="oeffnen">
      <div class="zeile1"><span class="preis">${eur(w.preis)}</span><span class="meta">${f.qm}</span></div>
      <div class="titel">${esc(w.titel)}</div>
      <div class="fakten">${f.txt.map(esc).join('<span class="meta">·</span>')}</div>
      <div class="meta" style="margin-top:3px">${esc(w.adresse ? w.adresse + ' · ' : '')}${BEZIRKE[w.plz] || ''} Bezirk${w.status === 'raus' ? ' · ' + esc(w.gruende.join(' · ')) : ''}</div>
      <div class="quellen">${[...new Set((w.links || [{ quelle: w.quelle }]).map(l => l.quelle))].map(q => `<span>${esc(q)}</span>`).join('')}</div>
      ${mapsLinks(w)}
      ${tagsHtml(w)}
    </div>
  </article>`;
}

/* Marker als Eier: Farbe = Status, gestrichelt = Lage ungefähr, weiß = scho gschaut,
   goldener Rand = neu, im Nest = gemerkt */
function eiSvg(w, groesse) {
  const c = FARBE[w.status], g = w._gesehen ?? istGesehen(w), n = w.neu && !g && w.status !== 'raus';
  const rand = g ? c : n ? '#e3a400' : '#ffffff';
  return `<svg viewBox="-2 -2 24 30" width="${groesse * .8}" height="${groesse}">
    <path d="${EI}" fill="${g ? '#fff' : c}" fill-opacity="${!g && w.ungefaehr ? .5 : 1}"
      stroke="${rand}" stroke-width="${n || g ? 2.6 : 1.8}" ${w.ungefaehr ? 'stroke-dasharray="3 2.2"' : ''}/>
    ${g ? '' : '<ellipse cx="6.6" cy="9" rx="2" ry="3.4" fill="#fff" opacity=".45" transform="rotate(-18 6.6 9)"/>'}</svg>`;
}
function eiIcon(w) {
  const aktiv = state.aktiv === w.id, k = aktiv ? 1.6 : 1;  // gerade geöffnete Wohnung: großes Ei mit Puls
  const cls = 'ei-icon' + (aktiv ? ' aktiv' : '');
  if (istGemerkt(w)) {  // Ei im Nest
    return L.divIcon({ className: cls, iconSize: [42 * k, 40 * k], iconAnchor: [21 * k, 30 * k], html: `
      <svg viewBox="0 0 36 34" width="${42 * k}" height="${40 * k}">
        <g transform="translate(8 0)">${eiSvg(w, 26).replace(/^<svg[^>]*>|<\/svg>$/g, '')}</g>
        <path d="M2 20 Q18 36 34 20 Q33 28 26 31 Q18 34 10 31 Q3 28 2 20Z" fill="#9a6b3f" stroke="#fff" stroke-width="1.2"/>
        <path d="M5 23 Q15 29 25 26 M9 28 Q20 31 31 23" stroke="#6e4826" stroke-width="1.2" fill="none"/>
      </svg>` });
  }
  const s = (w.status === 'raus' ? 17 : istGesehen(w) ? 22 : 28) * (aktiv ? 1.7 : 1);
  return L.divIcon({ className: cls, iconSize: [s * .8, s], iconAnchor: [s * .4, s * .55],
    html: eiSvg(aktiv ? { ...w, _gesehen: false, neu: false } : w, s) });
}
// Ei einer Wohnung neu zeichnen (z. B. wenn sie geöffnet/geschlossen wird)
function eiAktualisieren(id) {
  const m = state.marker[id], w = id && state.daten.find(x => x.id === id);
  if (!m || !w) return;
  m.setIcon(eiIcon(w));
  m.setZIndexOffset(state.aktiv === id ? 10000 : istGemerkt(w) ? 1000 : ({ raus: 0, grau: 1, gruen: 2 })[w.status] * 100);
}

function zeichneMarker(liste) {
  markerEbene.clearLayers();
  state.marker = {};
  const rang = { raus: 0, grau: 1, gruen: 2 };
  [...liste].sort((a, b) => rang[a.status] - rang[b.status] + (istGemerkt(a) - istGemerkt(b)) * 10).forEach(w => {
    if (!w.lat) return;
    const m = L.marker([w.lat, w.lon], { icon: eiIcon(w),
      zIndexOffset: state.aktiv === w.id ? 10000 : istGemerkt(w) ? 1000 : rang[w.status] * 100 });
    m.bindTooltip(`<div class="vorschau">${w.bild ? img(w.bild) : ''}<div><b>${eur(w.preis)}</b> · ${w.flaeche ?? '?'} m² · ${w.zimmer ?? '?'} Zi<br>${esc((w.titel || '').slice(0, 60))}</div></div>`,
      { className: 'vorschau', direction: 'top', offset: [0, -8], opacity: 1 });
    m.on('click', () => oeffne(w.id, true));
    m.addTo(markerEbene);
    state.marker[w.id] = m;
  });
}

function zeichne() {
  const s = sichtbar();
  zeichneMarker(s.karte);
  const liste = sortiere([...s[state.tab]]);
  document.getElementById('nAlle').textContent = s.alle.length;
  document.getElementById('nGemerkt').textContent = s.gemerkt.length;
  document.getElementById('nPapierkorb').textContent = s.papierkorb.length;
  document.getElementById('nTreffer').textContent = s.alle.length;
  const leer = { alle: 'Gigibird findet für diese Filter grad kein Nestle.',
    gemerkt: 'Noch kein Ei im Nest. Tipp bei einem Nestle auf 🥚, dann brütet Gigibird drauf.',
    papierkorb: "Nix aus'm Nest gheit. Was du mit ✕ rauswirfst, landet hier und kann zurückgeholt werden." }[state.tab];
  document.getElementById('liste').innerHTML = liste.length
    ? liste.map(w => karteHtml(w, state.tab === 'papierkorb')).join('')
    : `<div class="leer">${leer}</div>`;
  if (state.aktiv) zeigeDetail(state.aktiv, false);
}

/* ---------- Detailansicht ---------- */
async function zeigeDetail(id, neuLaden = true) {
  const w = state.daten.find(x => x.id === id);
  const el = document.getElementById('detail');
  if (!w) { el.classList.remove('offen'); return; }
  const f = fakten(w), h = w.heizung || {}, e = w.energie || {};
  const bilder = w.bilder?.length ? w.bilder : (w.bild ? [w.bild] : []);
  state.bildIdx = Math.min(state.bildIdx, Math.max(0, bilder.length - 1));
  const papierkorb = imPapierkorb(w);
  const hist = (w.preis_historie || []).map(([d, p]) => `${esc(d)}: ${eur(p)}`).join(', ');
  el.innerHTML = `
    <div class="detail-kopf">
      <button class="btn" data-akt="schliessen">← Zurück</button>
      <button class="btn nur-handy" data-akt="aufkarte">📍 Karte</button>
      <span class="spacer"></span>
      ${papierkorb ? `<button class="btn" data-akt="zurueck" data-id="${esc(w.id)}">↺ Zurückholen</button>`
        : `<button class="btn" data-akt="merken" data-id="${esc(w.id)}" style="${istGemerkt(w) ? 'color:#7a5a00;background:#fff3cc;border-color:#e3a400' : ''}">🥚 ${istGemerkt(w) ? 'Im Nest' : 'Ins Nest'}</button>
           <button class="btn" data-akt="weg" data-id="${esc(w.id)}" style="color:#d24b3e">✕ Aus'm Nest</button>`}
    </div>
    ${bilder.length ? `<div class="galerie">
      ${img(bilder[state.bildIdx], 'class="gross" data-akt="vollbild-detail"')}
      <span class="voll-hinweis">⤢ Vollbild</span>
      ${bilder.length > 1 ? `<button class="foto-nav l" data-akt="gal-l" aria-label="Foto zurück">‹</button><button class="foto-nav r" data-akt="gal-r" aria-label="Foto weiter">›</button>
      <span class="foto-zahl">${state.bildIdx + 1} / ${bilder.length}</span>` : ''}
    </div>
    <div class="thumbs">${bilder.map((b, i) => img(b, `data-akt="gal" data-i="${i}" class="${i === state.bildIdx ? 'an' : ''}"`)).join('')}</div>` : ''}
    <div class="detail-body">
      <div class="zeile1"><span class="preis" style="font-size:22px">${eur(w.preis)}</span><span class="meta">${f.qm}</span></div>
      <h2>${esc(w.titel)}</h2>
      ${tagsHtml(w)}
      <div class="grid" style="margin-top:12px">
        <div class="fakt"><b>${w.flaeche ?? '?'} m²</b><span>Wohnfläche</span></div>
        <div class="fakt"><b>${w.zimmer ?? '?'}</b><span>Zimmer</span></div>
        <div class="fakt"><b>${esc((w.freiflaeche || []).join(', ') || '–')}</b><span>Freifläche</span></div>
        <div class="fakt"><b>${w.stockwerk != null ? esc(w.stockwerk) : '–'}</b><span>Stockwerk</span></div>
        <div class="fakt"><b>${esc([w.bauart, w.baujahr].filter(Boolean).join(', ') || '–')}</b><span>Gebäude</span></div>
        <div class="fakt"><b>${esc(w.zustand || '–')}</b><span>Zustand</span></div>
        <div class="fakt"><b>${w.monatlich ? eur(w.monatlich) : '–'}</b><span>monatliche Kosten</span></div>
        <div class="fakt"><b>${e.hwb ? 'HWB ' + esc(e.hwb) + (e.hwb_class ? ' (' + esc(e.hwb_class) + ')' : '') : '–'}</b><span>Energie${e.fgee ? ' · fGEE ' + esc(e.fgee) : ''}</span></div>
      </div>
      <h3>Lage</h3>
      <div class="info ${w.ungefaehr ? 'grau' : 'gruen'}">${esc(w.adresse ? w.adresse + ' · ' : '')}${esc(w.lage || '')}</div>
      ${mapsLinks(w, true)}
      <h3>Heizung</h3>
      <div class="info ${h.ergebnis === 'kein_gas' ? 'gruen' : h.ergebnis === 'gas' ? 'raus' : 'grau'}"><b>${HEIZ_TXT[h.ergebnis] || '–'}</b>${h.von ? ` <span class="meta">(${esc(h.von)})</span>` : ''}<br>${esc(h.text || '')}</div>
      ${w.gruende?.length ? `<h3>Hinweise</h3><div class="info ${w.status}">${esc(w.gruende.join(' · '))}</div>` : ''}
      ${hist ? `<h3>Preisverlauf</h3><div class="info">vorher ${hist}, jetzt ${eur(w.preis)}</div>` : ''}
      <h3>Beschreibung</h3>
      <div class="text" id="dText">${state.details[w.id] ? textHtml(state.details[w.id].text) : '<span class="meta">lädt …</span>'}</div>
      <div class="meta" style="margin-top:14px">${esc(w.anbieter || '')} · online seit ${esc(w.erstmals)} · ${esc(w.quelle)}</div>
      <h3>${(w.links || []).length > 1 ? `Auf ${w.links.length} Inseraten` : 'Inserat'}</h3>
      <div class="links">${(w.links || [{ quelle: w.quelle, url: w.url, preis: w.preis }]).map((l, i, alle) => `
        <a class="link" href="${esc(l.url)}" target="_blank" rel="noopener">
          <span class="q">${esc(l.quelle)}${alle.filter(x => x.quelle === l.quelle).length > 1
            ? ` <span class="meta">Inserat ${alle.filter(x => x.quelle === l.quelle).indexOf(l) + 1}</span>` : ''}</span><span class="meta">${eur(l.preis)}</span><span class="pfeil">↗</span>
        </a>`).join('')}</div>
    </div>`;
  el.classList.add('offen');
  if (neuLaden) el.scrollTop = 0;
  if (!state.details[w.id]) {
    try {
      state.details[w.id] = await fetch(`d/${encodeURIComponent(w.id)}.json`).then(r => r.ok ? r.json() : { text: '' });
    } catch { state.details[w.id] = { text: '' }; }
    const t = document.getElementById('dText');
    if (t && state.aktiv === w.id) t.innerHTML = textHtml(state.details[w.id].text) || '<span class="meta">Keine Beschreibung gespeichert.</span>';
  }
}
function textHtml(t) {
  return esc(t || '').replace(/^## (.+)$/gm, '<h4>$1</h4>').replace(/\n(<h4>)/g, '$1').replace(/(<\/h4>)\n/g, '$1');
}
function oeffne(id, vonKarte) {
  const vorher = state.aktiv;
  state.aktiv = id; state.bildIdx = 0;
  const w = state.daten.find(x => x.id === id);
  if (w && !istGesehen(w)) {
    markiere('gesehen', id, new Date().toISOString());
    const k = document.querySelector(`.karte[data-id="${CSS.escape(id)}"]`);
    if (k && w) { k.classList.add('gesehen'); k.querySelector('.tags').outerHTML = tagsHtml(w); }
  }
  if (vorher && vorher !== id) eiAktualisieren(vorher);
  eiAktualisieren(id);
  document.querySelectorAll('.karte.aktiv').forEach(x => x.classList.remove('aktiv'));
  const karte = document.querySelector(`.karte[data-id="${CSS.escape(id)}"]`);
  karte?.classList.add('aktiv');
  if (vonKarte) karte?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  zeigeDetail(id);
  const m = state.marker[id];
  if (m && !vonKarte) map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 16), { duration: .6 });
}
function schliesse() {
  const vorher = state.aktiv;
  state.aktiv = null;
  document.getElementById('detail').classList.remove('offen');
  if (vorher) eiAktualisieren(vorher);
}

/* ---------- Fotos im Vollbild ---------- */
const vb = { el: document.getElementById('vollbild'), w: null, i: 0, vonDetail: false };
function vollbildAuf(w, i, vonDetail) {
  const bilder = w.bilder?.length ? w.bilder : (w.bild ? [w.bild] : []);
  if (!bilder.length) return;
  Object.assign(vb, { w, i, vonDetail, bilder });
  vb.el.querySelector('.t').textContent = `${eur(w.preis)} · ${w.flaeche ?? '?'} m² · ${w.titel || ''}`;
  vb.el.querySelector('.vb-thumbs').innerHTML = bilder.map((b, k) => img(b, `data-i="${k}"`)).join('');
  vb.el.classList.add('offen');
  vollbildZeigen();
}
function vollbildZeigen() {
  const n = vb.bilder.length;
  vb.i = (vb.i + n) % n;
  const bild = vb.el.querySelector(':scope > img');
  bild.referrerPolicy = 'no-referrer';
  bild.src = vb.bilder[vb.i];
  vb.el.querySelector('.vb-zahl').textContent = `${vb.i + 1} / ${n}`;
  vb.el.querySelectorAll('.vb-thumbs img').forEach((t, k) => t.classList.toggle('an', k === vb.i));
  vb.el.querySelector('.vb-thumbs img.an')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  // nächstes Bild schon vorladen
  const vor = new Image(); vor.referrerPolicy = 'no-referrer'; vor.src = vb.bilder[(vb.i + 1) % n];
}
function vollbildZu() {
  vb.el.classList.remove('offen');
  if (vb.vonDetail && state.aktiv) { state.bildIdx = vb.i; zeigeDetail(state.aktiv, false); }
}
vb.el.querySelector('.vb-zu').addEventListener('click', vollbildZu);
vb.el.querySelector('.vb-l').addEventListener('click', () => { vb.i--; vollbildZeigen(); });
vb.el.querySelector('.vb-r').addEventListener('click', () => { vb.i++; vollbildZeigen(); });
vb.el.querySelector('.vb-thumbs').addEventListener('click', e => {
  if (e.target.dataset.i) { vb.i = +e.target.dataset.i; vollbildZeigen(); }
});
vb.el.addEventListener('click', e => { if (e.target === vb.el) vollbildZu(); });  // Klick daneben schließt
let vbStart = null;
vb.el.addEventListener('touchstart', e => { vbStart = e.touches[0].clientX; }, { passive: true });
vb.el.addEventListener('touchend', e => {
  if (vbStart == null) return;
  const dx = e.changedTouches[0].clientX - vbStart; vbStart = null;
  if (Math.abs(dx) > 40) { vb.i += dx < 0 ? 1 : -1; vollbildZeigen(); }
}, { passive: true });

/* ---------- Aktionen ---------- */
const punkt = id => state.daten.find(x => x.id === id) || { id };
const entferneAlle = (liste, w) => idsVon(w).forEach(i => { if (mein[liste][i]) markiere(liste, i, null); });
function merken(id) {
  const w = punkt(id);
  if (istGemerkt(w)) entferneAlle('gemerkt', w); else markiere('gemerkt', id, new Date().toISOString());
  zeichne();
}
function wegwerfen(id) {
  const w = punkt(id);
  markiere('papierkorb', id, new Date().toISOString());
  entferneAlle('gemerkt', w);
  if (state.aktiv === id) schliesse();
  zeichne();
}
function wiederherstellen(id) { entferneAlle('papierkorb', punkt(id)); zeichne(); }

document.getElementById('app').addEventListener('click', e => {
  const t = e.target.closest('[data-akt]'); if (!t) return;
  const id = t.dataset.id || t.closest('[data-id]')?.dataset.id;
  const akt = t.dataset.akt;
  if (akt === 'link') return;  // externer Link (Google Maps): normal öffnen, Wohnung nicht aufklappen
  if (akt === 'merken') return merken(id);
  if (akt === 'weg') return wegwerfen(id);
  if (akt === 'zurueck') return wiederherstellen(id);
  if (akt === 'oeffnen') return oeffne(id);
  if (akt === 'vollbild') {  // Foto in der Liste: Vollbild ab dem gerade sichtbaren Foto
    const streifen = t.closest('.fotos');
    return vollbildAuf(punkt(id), Math.round(streifen.scrollLeft / streifen.clientWidth), false);
  }
  if (akt === 'vollbild-detail') return vollbildAuf(punkt(state.aktiv), state.bildIdx, true);
  if (akt === 'schliessen') return schliesse();
  if (akt === 'aufkarte') {  // Handy: Details zuklappen, Wohnung bleibt auf der Karte hervorgehoben
    document.getElementById('detail').classList.remove('offen');
    const m = state.marker[state.aktiv];
    if (m) setTimeout(() => map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 16), { duration: .6 }), 250);
    return;
  }
  if (akt === 'links' || akt === 'rechts') {
    const f = t.closest('.foto-wrap').querySelector('.fotos');
    f.scrollBy({ left: (akt === 'rechts' ? 1 : -1) * f.clientWidth, behavior: 'smooth' });
    return;
  }
  if (akt.startsWith('gal')) {
    const w = state.daten.find(x => x.id === state.aktiv), n = (w.bilder || []).length || 1;
    state.bildIdx = akt === 'gal' ? +t.dataset.i : (state.bildIdx + (akt === 'gal-r' ? 1 : -1) + n) % n;
    zeigeDetail(state.aktiv, false);
  }
});
// Wischen durch die Fotos in der Detailansicht (Handy)
let wischStart = null;
document.getElementById('detail').addEventListener('touchstart', e => {
  wischStart = e.target.closest('.galerie') ? e.touches[0].clientX : null;
}, { passive: true });
document.getElementById('detail').addEventListener('touchend', e => {
  if (wischStart == null || !state.aktiv) return;
  const dx = e.changedTouches[0].clientX - wischStart;
  wischStart = null;
  if (Math.abs(dx) < 40) return;
  const w = state.daten.find(x => x.id === state.aktiv), n = (w?.bilder || []).length || 1;
  state.bildIdx = (state.bildIdx + (dx < 0 ? 1 : -1) + n) % n;
  zeigeDetail(state.aktiv, false);
}, { passive: true });

// Handy: Karte groß/klein
const groesse = L.control({ position: 'topleft' });
groesse.onAdd = () => {
  const b = L.DomUtil.create('button', 'btn karte-groesse');
  b.textContent = '⤢ Karte groß';
  L.DomEvent.disableClickPropagation(b);
  b.addEventListener('click', () => {
    const gross = document.getElementById('app').classList.toggle('karte-gross');
    b.textContent = gross ? '⤡ Liste zeigen' : '⤢ Karte groß';
    setTimeout(() => map.invalidateSize(), 50);
  });
  return b;
};
groesse.addTo(map);

document.addEventListener('keydown', e => {
  if (vb.el.classList.contains('offen')) {  // Vollbild hat Vorrang
    if (e.key === 'Escape') vollbildZu();
    if (e.key === 'ArrowRight') { vb.i++; vollbildZeigen(); }
    if (e.key === 'ArrowLeft') { vb.i--; vollbildZeigen(); }
    return;
  }
  if (!state.aktiv || e.target.matches('input, select')) return;
  if (e.key === 'Escape') schliesse();
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const w = state.daten.find(x => x.id === state.aktiv), n = (w?.bilder || []).length || 1;
    state.bildIdx = (state.bildIdx + (e.key === 'ArrowRight' ? 1 : -1) + n) % n;
    zeigeDetail(state.aktiv, false);
  }
});
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  state.tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b));
  schliesse(); zeichne();
}));
document.getElementById('btnOeffis').addEventListener('click', e => {
  const an = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', an);
  an ? oeffiEbene.addTo(map) : oeffiEbene.remove();
  document.querySelectorAll('.oeffi-leg').forEach(x => x.style.display = an ? '' : 'none');
});

/* ---------- Filter-UI ---------- */
function chipGruppe(el, werte, key, label) {
  el.innerHTML = werte.map(v => `<button class="chip" data-v="${esc(v)}">${label(v)}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    const v = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v;
    filter[key] = filter[key].includes(v) ? filter[key].filter(x => x !== v) : [...filter[key], v];
    filterGeaendert();
  }));
}
function filterUi() {
  document.getElementById('fPreis').value = filter.preis ?? '';
  document.getElementById('fFlaeche').value = filter.flaeche ?? '';
  document.getElementById('fZimmer').value = filter.zimmer ?? '';
  document.getElementById('fSort').value = filter.sort;
  document.querySelectorAll('#fBezirke .chip').forEach(b => b.setAttribute('aria-pressed', filter.bezirke.includes(+b.dataset.v)));
  document.querySelectorAll('#fStatus .chip').forEach(b => b.setAttribute('aria-pressed', filter.status.includes(b.dataset.v)));
  document.querySelectorAll('#fExtra .chip').forEach(b => b.setAttribute('aria-pressed', !!filter[b.dataset.k]));
}
function filterGeaendert() { mein.filter = filter; sichern(); filterUi(); zeichne(); }
chipGruppe(document.getElementById('fBezirke'), Object.keys(BEZIRKE).map(Number), 'bezirke', v => BEZIRKE[v]);
chipGruppe(document.getElementById('fStatus'), ['gruen', 'grau', 'raus'], 'status',
  v => `<span class="dot" style="background:${FARBE[v]}"></span>${STATUS_TXT[v]}`);
document.getElementById('fExtra').innerHTML = '<button class="chip" data-k="neu">nur neue</button><button class="chip" data-k="freiflaeche">mit Freifläche</button><button class="chip" data-k="ungesehen">no ned gschaut</button>';
document.querySelectorAll('#fExtra .chip').forEach(b => b.addEventListener('click', () => { filter[b.dataset.k] = !filter[b.dataset.k]; filterGeaendert(); }));
[['fPreis', 'preis'], ['fFlaeche', 'flaeche'], ['fZimmer', 'zimmer']].forEach(([id, k]) =>
  document.getElementById(id).addEventListener('input', e => { filter[k] = e.target.value ? +e.target.value : null; filterGeaendert(); }));
document.getElementById('fSort').addEventListener('change', e => { filter.sort = e.target.value; filterGeaendert(); });
document.getElementById('fReset').addEventListener('click', () => { filter = Object.assign({}, STD_FILTER); filterGeaendert(); });
document.getElementById('btnFilter').addEventListener('click', e => {
  const an = document.getElementById('filter').classList.toggle('offen');
  document.getElementById('app').classList.toggle('filter-offen', an);
  e.currentTarget.setAttribute('aria-pressed', an);
  setTimeout(() => map.invalidateSize(), 50);
});

/* ---------- Start ---------- */
(async () => {
  filterUi();
  ladeGebiete().catch(console.error);
  const d = await fetch('listings.json', { cache: 'no-store' }).then(r => r.json());
  state.daten = d.wohnungen;
  const nq = (d.quellen || ['willhaben']).length;
  document.getElementById('stand').textContent = `Stand ${d.stand} · ${nq} ${nq === 1 ? 'Portal' : 'Portale'}`;
  document.getElementById('stand').title = (d.quellen || ['willhaben']).join(', ');
  zeichne();
  gemeinsam.start(zeichne);
})();
</script>
</body>
</html>
