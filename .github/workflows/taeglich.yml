name: Täglich scrapen

on:
  schedule:
    # GitHub lässt geplante Läufe zu Stoßzeiten (volle Stunde, :15) manchmal ausfallen, daher
    # ungerade Minuten und zwei Ersatztermine; wer heute schon gescrapt hat, überspringt.
    - cron: "23 4 * * *"   # 06:23 Wiener Sommerzeit / 05:23 Winterzeit
    - cron: "53 5 * * *"
    - cron: "37 7 * * *"
  # Die tägliche Prüf-Routine (Claude) stößt den Lauf an, falls er bis dahin fehlt: sie
  # committet data/anstoss.txt (GITHUB_TOKEN-Commits des Bots selbst lösen nichts aus).
  push:
    branches: [main]
    paths: [data/anstoss.txt]
  workflow_dispatch:
    inputs:
      quellen:
        description: "nur diese Portale, z. B. fm oder wh,is (leer = alle)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Heute schon gescrapt?
        id: heute
        run: |
          git pull --quiet origin main || true
          if [ "${{ github.event_name }}" = "schedule" ] && \
             [ "$(cat data/letzter_scrape.txt 2>/dev/null)" = "$(TZ=Europe/Vienna date +%F)" ]; then
            echo "Heute schon gescrapt, nichts zu tun."
            echo "fertig=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.heute.outputs.fertig != '1'
        with:
          python-version: "3.12"
      - name: Gemeinsame Markierungen sichern
        # vor dem Bauen: Nest (Preisverlauf) und Papierkorb (Adress-Recherche) aktuell
        if: steps.heute.outputs.fertig != '1'
        run: |
          URL=$(python -c "import json;print(json.load(open('docs/einstellungen.json')).get('firebase',''))" 2>/dev/null || true)
          if [ -n "$URL" ]; then curl -sf "${URL%/}/markierungen.json" -o data/markierungen.json || echo "Backup fehlgeschlagen"; fi
      - name: Scrapen und Karte bauen
        if: steps.heute.outputs.fertig != '1'
        # SCRAPE_MAX_MIN: danach bricht jede Portal-Anfrage ab und der Lauf speichert, was er hat
        # (2026-10-29 lief er wegen derStandard-/FindMyHome-Sperren in den 2-h-Abbruch, ohne zu speichern)
        timeout-minutes: 95
        run: |
          if [ -n "$QUELLEN" ]; then python run.py all --quellen "$QUELLEN"
          else python run.py all && date +%F > data/letzter_scrape.txt; fi
        env:
          TZ: Europe/Vienna
          QUELLEN: ${{ github.event.inputs.quellen }}
          SCRAPE_MAX_MIN: "75"
      - name: Grundrisse für die Adress-Recherche
        if: steps.heute.outputs.fertig != '1'
        timeout-minutes: 10
        continue-on-error: true
        # passende neue Wohnungen ohne genaue Adresse (data/recherche.json): die Prüf-Routine in der
        # Cloud kommt nicht an die Portalbilder, daher hier speichern
        run: |
          pip install -q pillow
          python tools/grundrisse.py --recherche || echo "Grundrisse fehlgeschlagen"
      - name: Speichern
        if: steps.heute.outputs.fertig != '1'
        run: |
          git config user.name "wohnungssuche-bot"
          git config user.email "actions@users.noreply.github.com"
          # Der Scrape dauert bis zu einer Stunde; wer in der Zeit pusht (Prüf-Routine, Claude),
          # würde beim Rebase in den erzeugten Dateien kollidieren. Dann: neuesten Stand von main
          # nehmen, nur die Scrape-Ergebnisse darüberlegen, Karte neu bauen, nochmal pushen.
          SICHER=$(mktemp -d)
          cp data/listings.json data/geocode_cache.json data/markierungen.json data/letzter_scrape.txt "$SICHER"/ 2>/dev/null || true
          [ -d data/grundrisse ] && cp -r data/grundrisse "$SICHER"/
          for versuch in 1 2 3 4 5; do
            git add data docs
            git diff --cached --quiet || git commit -q -m "Daten $(TZ=Europe/Vienna date +%F)"
            git push origin HEAD:main && exit 0
            echo "Push abgelehnt (Versuch $versuch), übernehme neuen Stand von main"
            git fetch -q origin main
            git reset -q --hard origin/main
            python - "$SICHER" <<'EOF'
          import json, shutil, sys
          s = sys.argv[1]
          for f in ("listings.json", "markierungen.json", "letzter_scrape.txt"):
              try: shutil.copyfile(f"{s}/{f}", f"data/{f}")
              except FileNotFoundError: pass
          try: shutil.copytree(f"{s}/grundrisse", "data/grundrisse", dirs_exist_ok=True)
          except FileNotFoundError: pass
          cache = json.load(open("data/geocode_cache.json", encoding="utf-8"))
          cache.update(json.load(open(f"{s}/geocode_cache.json", encoding="utf-8")))
          json.dump(cache, open("data/geocode_cache.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          EOF
            python run.py build
            sleep $((versuch * 10))
          done
          exit 1
        env:
          TZ: Europe/Vienna
